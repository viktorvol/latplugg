<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#23324A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Låtplugg">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💿</text></svg>">
<title>Låtplugg</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#23324A; --surf:#2E4060; --surf2:#3A4E72; --line:#4D6390;
  --amber:#FFB347; --amber-ink:#2A1A05; --ink:#F4EFE6; --muted:#A9B5C8;
  --ok:#7BD389; --no:#FF7A6B;
  --display:"Bricolage Grotesque", "Arial Black", system-ui, sans-serif;
  --body:Figtree, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.app{max-width:480px;margin:0 auto;padding:12px 18px 32px;overflow-x:hidden}
header{display:flex;align-items:center;justify-content:space-between;padding:6px 0 14px}
.brand{font-family:var(--display);font-weight:800;font-size:1.35rem;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.brand svg{width:26px;height:26px}
.iconbtn{background:none;border:0;padding:8px;border-radius:10px;color:var(--muted);display:grid;place-items:center}
.iconbtn:hover{color:var(--ink);background:var(--surf)}
.iconbtn svg{width:24px;height:24px}
.hidden{display:none!important}

.hero{font-family:var(--display);font-weight:800;font-size:2.4rem;line-height:1.02;letter-spacing:-.02em;margin:18px 0 10px}
.lede{color:var(--muted);margin:0 0 26px}
.meter{height:12px;border-radius:6px;background:var(--surf);display:flex;overflow:hidden;margin-bottom:12px}
.meter span{display:block;height:100%}
.legend{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:30px}
.legend div{font-size:.85rem;color:var(--muted)}
.legend b{display:block;font-family:var(--display);font-size:1.5rem;color:var(--ink);font-weight:700}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle}
.primary{width:100%;border:0;border-radius:14px;background:var(--amber);color:var(--amber-ink);font-weight:700;font-size:1.1rem;padding:16px}
.primary:active{transform:translateY(1px)}
.primary:disabled{opacity:.45}
.secondary{border:1.5px solid var(--line);background:transparent;border-radius:14px;padding:13px 16px;font-weight:600}
.note{background:var(--surf);border-radius:12px;padding:12px 14px;font-size:.92rem;color:var(--muted);margin-top:20px}
.note button{background:none;border:0;color:var(--amber);padding:0;font-weight:600;text-decoration:underline}

.roundbar{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.roundbar .count{font-weight:600;font-size:.92rem;color:var(--muted);white-space:nowrap}
.pips{flex:1;display:flex;gap:4px}
.pips span{flex:1;height:6px;border-radius:3px;background:var(--surf2)}
.pips span.done{background:var(--amber)}
.pips span.cur{background:var(--ink)}
.textbtn{background:none;border:0;color:var(--muted);font-size:.92rem;padding:6px}

/* The record */
.stage{position:relative;width:72%;max-width:300px;margin:6px auto 22px;aspect-ratio:1;display:block;border:0;padding:0;background:none;border-radius:50%}
.lp{position:absolute;inset:0;border-radius:50%;
  background:
    radial-gradient(circle at 50% 50%, transparent 0 31%, rgba(255,255,255,.05) 31.5%, transparent 32%),
    conic-gradient(from 20deg, rgba(255,255,255,.10), transparent 12%, transparent 45%, rgba(255,255,255,.08) 55%, transparent 68%),
    repeating-radial-gradient(circle at 50% 50%, #121a28 0 2px, #1b2639 2px 4px);
  box-shadow:0 14px 36px rgba(0,0,0,.45), inset 0 0 0 6px #0e1420}
.lp .label{position:absolute;inset:32%;border-radius:50%;background:var(--amber);display:grid;place-items:center;
  font-family:var(--display);font-weight:800;color:var(--amber-ink);font-size:clamp(1.6rem,8vw,2.6rem)}
.lp .label::after{content:"";position:absolute;width:9%;height:9%;border-radius:50%;background:var(--bg);top:45.5%;left:45.5%}
.lp .label span{transform:translateY(-22%)}
.stage.playing .lp{animation:spin 1.8s linear infinite}
.lpwrap{position:absolute;inset:0;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.cover{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:6px;box-shadow:0 14px 36px rgba(0,0,0,.5);
  opacity:0;transform:translateX(-10%) scale(.94);transition:opacity .35s ease,transform .5s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.stage.revealed .cover{opacity:1;transform:none}
.stage.revealed .lpwrap{transform:translateX(24%)}
@media (prefers-reduced-motion:reduce){.cover,.lpwrap{transition:none}}
.stage.loading .lp{animation:spin 4s linear infinite;opacity:.7}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.stage.playing .lp,.stage.loading .lp{animation:none}}
.time{height:4px;border-radius:2px;background:var(--surf2);margin:-6px auto 18px;width:72%;max-width:300px;overflow:hidden}
.time span{display:block;height:100%;width:0;background:var(--amber)}

.controls{display:flex;gap:10px;margin-bottom:18px}
.controls .play{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;background:var(--ink);color:var(--bg);font-weight:700;padding:13px}
.controls svg{width:20px;height:20px}
.controls .secondary{display:flex;align-items:center;gap:6px}
.err{background:rgba(255,122,107,.14);border:1px solid rgba(255,122,107,.5);border-radius:12px;padding:12px 14px;margin-bottom:16px;font-size:.95rem}
.err .btnrow{margin-top:10px}

.field{position:relative;margin-bottom:12px}
.field label{display:block;font-size:.85rem;font-weight:600;color:var(--muted);margin-bottom:5px}
.field input{width:100%;background:var(--surf);border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;font-size:1.05rem}
.field input:focus{border-color:var(--amber);outline:none}
.ac{position:absolute;z-index:20;left:0;right:0;top:100%;background:var(--surf2);border-radius:12px;
  box-shadow:0 12px 30px rgba(0,0,0,.45);max-height:270px;overflow:auto;padding:4px;list-style:none;margin:4px 0 0}
.ac li{padding:11px 12px;border-radius:8px;cursor:pointer}
.ac li.on,.ac li:hover{background:var(--line)}
.ac li mark{background:none;color:var(--amber);font-weight:700}
.answerrow{display:flex;gap:10px;margin-top:6px}
.answerrow .primary{flex:2}
.answerrow .secondary{flex:1}

.res{display:grid;grid-template-columns:28px 1fr;gap:4px 10px;align-items:start;padding:12px 0;border-bottom:1px solid var(--surf2)}
.res .mark{font-size:1.2rem;font-weight:800;line-height:1.3}
.res .mark.y{color:var(--ok)} .res .mark.n{color:var(--no)}
.res .k{font-size:.8rem;color:var(--muted)}
.res .v{font-family:var(--display);font-weight:700;font-size:1.25rem;line-height:1.2}
.res .you{font-size:.9rem;color:var(--muted)}
.res .you s{color:var(--no)}
.verdict{margin:14px 0 6px;color:var(--muted);font-size:.95rem}
.alt{margin:6px 0 14px}
.alt ul{list-style:none;padding:0;margin:8px 0 0}
.alt li button{width:100%;text-align:left;background:var(--surf);border:0;border-radius:10px;padding:10px 12px;margin-bottom:6px}
.alt li button small{display:block;color:var(--muted)}
.alt li button.cur{outline:2px solid var(--amber)}

.sumlist{list-style:none;padding:0;margin:0 0 24px}
.sumlist li{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--surf2)}
.sumlist img{width:48px;height:48px;object-fit:cover;border-radius:4px;flex:none;background:var(--surf)}
.sumlist .t{flex:1;min-width:0}
.sumlist .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sumlist .t span{font-size:.88rem;color:var(--muted)}
.dots{display:flex;gap:4px;flex:none}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--no)}
.dots i.y{background:var(--ok)}
.btnrow{display:flex;gap:10px}
.btnrow>*{flex:1}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:12px;font-weight:600;font-size:.95rem;z-index:100;max-width:90vw}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="15" fill="#121a28"/><circle cx="16" cy="16" r="10.5" fill="none" stroke="#2a3854" stroke-width="1"/><circle cx="16" cy="16" r="6" fill="#FFB347"/><circle cx="16" cy="16" r="1.6" fill="#23324A"/></svg>
      Låtplugg
    </div>
  </header>

  <section id="home">
    <h1 class="hero" id="heroText"></h1>
    <p class="lede" id="ledeText"></p>
    <div class="meter" id="meter" aria-hidden="true"></div>
    <div class="legend" id="legend"></div>
    <button class="primary" id="startBtn">Starta runda</button>
    <div class="note hidden" id="demoNote">Du övar på en demolista. Lägg in dina låtar i songs.txt så dyker de upp här.</div>
  </section>

  <section id="play" class="hidden">
    <div class="roundbar">
      <span class="count" id="roundCount"></span>
      <div class="pips" id="pips"></div>
      <button class="textbtn" id="quitBtn">Avsluta</button>
    </div>

    <button class="stage" id="stage" aria-label="Spela eller pausa">
      <div class="lpwrap"><div class="lp"><div class="label"><span>?</span></div></div></div>
      <img class="cover" id="cover" alt="">
    </button>
    <div class="time" aria-hidden="true"><span id="timeBar"></span></div>

    <div class="controls">
      <button class="play" id="playBtn"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l12-7.5z"/></svg><span>Spela</span></button>
      <button class="secondary" id="restartBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>Från början</button>
    </div>

    <div class="err hidden" id="errBox">
      <span id="errText"></span>
      <div class="btnrow"><button class="secondary" id="skipBtn">Hoppa över</button></div>
    </div>

    <div id="answerForm">
      <div class="field">
        <label for="artistIn">Artist</label>
        <input id="artistIn" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" role="combobox" aria-expanded="false" aria-controls="artistAc">
        <ul class="ac hidden" id="artistAc" role="listbox"></ul>
      </div>
      <div class="field">
        <label for="titleIn">Titel</label>
        <input id="titleIn" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" role="combobox" aria-expanded="false" aria-controls="titleAc">
        <ul class="ac hidden" id="titleAc" role="listbox"></ul>
      </div>
      <div class="answerrow">
        <button class="primary" id="submitBtn">Gissa</button>
        <button class="secondary" id="dunnoBtn">Vet inte</button>
      </div>
    </div>

    <div class="hidden" id="resultBox">
      <div class="res"><span class="mark" id="aMark"></span><div><div class="k">Artist</div><div class="v" id="aRight"></div><div class="you" id="aYou"></div></div></div>
      <div class="res"><span class="mark" id="tMark"></span><div><div class="k">Titel</div><div class="v" id="tRight"></div><div class="you" id="tYou"></div></div></div>
      <p class="verdict" id="verdict"></p>
      <div class="alt">
        <button class="textbtn" id="altBtn">Fel låt eller version? Välj en annan</button>
        <ul id="altList" class="hidden"></ul>
      </div>
      <button class="primary" id="nextBtn">Nästa låt</button>
    </div>
  </section>

  <section id="summary" class="hidden">
    <h1 class="hero" id="sumHero"></h1>
    <p class="lede" id="sumLede"></p>
    <ul class="sumlist" id="sumList"></ul>
    <div class="btnrow">
      <button class="secondary" id="homeBtn">Till start</button>
      <button class="primary" id="againBtn">Ny runda</button>
    </div>
  </section>
</div>

<audio id="audio" preload="auto" playsinline></audio>
<script src="common.js"></script>
<script>
const DEMO_SONGS = [
  {artist:"Queen", title:"Bohemian Rhapsody"},
  {artist:"Nirvana", title:"Smells Like Teen Spirit"},
  {artist:"Michael Jackson", title:"Billie Jean"},
  {artist:"The Beatles", title:"Hey Jude"}
];
const ROUND_SIZE = 10;
const INTERVALS = [0, 1, 2, 4, 8, 16, 32, 64, 128];
const KNOWN_LEVEL = 4;

let P = load(K_PROG) || {}; P.cards=P.cards||{}; P.skip=P.skip||{};
let R = load(K_RES) || {};
let REMOTE_RAW = load(K_REMOTE) || [];
let SONGS = [], usingDemo = false, apiDown = false;
const saveProg = () => save(K_PROG,P);
const saveRes = () => save(K_RES,R);
function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.append(t); setTimeout(()=>t.remove(),2800); }
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function today(){ const d=new Date(); return Math.floor((d.getTime()-d.getTimezoneOffset()*60000)/86400000); }

function combineSongs(){
  SONGS = prepSongs(REMOTE_RAW);
  usingDemo = !SONGS.length;
  if(usingDemo) SONGS = prepSongs(DEMO_SONGS);
  for(const s of SONGS) if(s.preview && !(R[s.key] && R[s.key].manual)) R[s.key]={tid:s.trackId,url:s.preview,art:s.art||(R[s.key]&&R[s.key].art)||""};
  rebuildOptions();
}
const hasAudio = s => !!(R[s.key] && R[s.key].url);

/* Låtar utan ljudlänk söks upp hos Apple. Det fungerar på datorn men inte i Safari på iPhone. */
async function resolveSongs(list){
  if(apiDown) return;
  for(const s of list.filter(s=>!hasAudio(s) && !(R[s.key] && R[s.key].none && Date.now()-R[s.key].at<86400000))){
    try{ const h=await bestHit(s); R[s.key]= h ? hitToRes(h) : {none:true,at:Date.now()}; }
    catch(e){ apiDown=true; break; }
    await sleep(350);
  }
  saveRes();
}

/* ---------- Autocomplete: fyller bara i fältet ---------- */
function uniqSorted(arr){ const m=new Map(); arr.forEach(x=>{ const k=fold(x).trim(); if(k && !m.has(k)) m.set(k,x); }); return [...m.values()].sort((a,b)=>a.localeCompare(b,"sv")); }
let artistOptions=[], titleOptions=[];
function rebuildOptions(){ artistOptions=uniqSorted(SONGS.map(s=>s.artist)); titleOptions=uniqSorted(SONGS.map(s=>s.title)); }
/* Spärr så att ett tryck i förslagslistan aldrig räknas som ett tryck på knappen under den */
let submitLockedUntil=0;
function lockSubmit(){ submitLockedUntil=Date.now()+600; }
function setupAC(input, list, getOpts){
  let items=[], idx=-1;
  function hide(){ list.classList.add("hidden"); input.setAttribute("aria-expanded","false"); idx=-1; }
  function render(){
    const q=fold(input.value).trim(); if(!q){ hide(); return; }
    const scored=[];
    for(const o of getOpts()){
      const f=fold(o), pos=f.indexOf(q); if(pos<0) continue;
      scored.push({o,pos,score: pos===0?0 : /[\s(]/.test(f[pos-1])?1:2});
    }
    scored.sort((a,b)=>a.score-b.score || a.o.localeCompare(b.o,"sv"));
    items=scored.slice(0,8); list.textContent="";
    if(!items.length){ hide(); return; }
    items.forEach((it,i)=>{
      const li=document.createElement("li"); li.setAttribute("role","option");
      li.append(it.o.slice(0,it.pos));
      const mk=document.createElement("mark"); mk.textContent=it.o.slice(it.pos,it.pos+q.length); li.append(mk);
      li.append(it.o.slice(it.pos+q.length));
      li.addEventListener("pointerdown",e=>{ e.preventDefault(); lockSubmit(); });
      li.addEventListener("mousedown",e=>e.preventDefault());
      li.addEventListener("click",e=>{ e.preventDefault(); e.stopPropagation(); pick(i); });
      list.append(li);
    });
    idx=-1; list.classList.remove("hidden"); input.setAttribute("aria-expanded","true");
  }
  function hl(){ [...list.children].forEach((li,i)=>li.classList.toggle("on",i===idx)); if(idx>=0) list.children[idx].scrollIntoView({block:"nearest"}); }
  function pick(i){ lockSubmit(); input.value=items[i].o; hide(); }
  input.addEventListener("input",render);
  input.addEventListener("blur",()=>setTimeout(hide,350));
  input.addEventListener("keydown",e=>{
    const open=!list.classList.contains("hidden");
    if(e.key==="ArrowDown"&&open){ e.preventDefault(); idx=Math.min(idx+1,items.length-1); hl(); }
    else if(e.key==="ArrowUp"&&open){ e.preventDefault(); idx=Math.max(idx-1,0); hl(); }
    else if(e.key==="Escape") hide();
    else if(e.key==="Enter"){ e.preventDefault(); if(open&&idx>=0) pick(idx); else hide(); }
  });
  return {hide};
}

/* ---------- Ljud ---------- */
const audio=$("audio");
function setPlaying(on){
  $("stage").classList.toggle("playing",on);
  const b=$("playBtn");
  b.querySelector("span").textContent = on ? "Pausa" : (audio.ended ? "Spela igen" : "Spela");
  b.querySelector("svg").innerHTML = on ? '<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>' : '<path d="M7 4.5v15l12-7.5z"/>';
}
audio.addEventListener("playing",()=>setPlaying(true));
audio.addEventListener("pause",()=>setPlaying(false));
audio.addEventListener("ended",()=>setPlaying(false));
audio.addEventListener("timeupdate",()=>{ $("timeBar").style.width = audio.duration ? (audio.currentTime/audio.duration*100)+"%" : "0"; });
audio.addEventListener("error",()=>{ if(current && audio.getAttribute("src")) showErr("Klippet gick inte att spela. Länken kan ha slutat fungera – skapa en ny songs.txt på datorn."); });
function loadAudio(url){ audio.pause(); if(url){ audio.src=url; audio.load(); } else audio.removeAttribute("src"); $("timeBar").style.width="0"; setPlaying(false); }
function togglePlay(){
  if(!audio.getAttribute("src")) return;
  if(!audio.paused){ audio.pause(); return; }
  if(audio.ended) audio.currentTime=0;
  audio.play().catch(()=>{});
}
function restart(){ if(!audio.getAttribute("src")) return; audio.currentTime=0; audio.play().catch(()=>{}); }
function showErr(t){ $("errText").textContent=t; $("errBox").classList.remove("hidden"); }

/* ---------- Spaced repetition ---------- */
function available(){ return SONGS.filter(s=>!P.skip[s.key] && (!apiDown || hasAudio(s))); }
function buildRound(){
  const t=today(), avail=available();
  const due=shuffle(avail.filter(s=>P.cards[s.key]&&P.cards[s.key].d<=t)).sort((a,b)=>P.cards[a.key].d-P.cards[b.key].d);
  const pick=due.slice(0,ROUND_SIZE);
  if(pick.length<ROUND_SIZE) pick.push(...shuffle(avail.filter(s=>!P.cards[s.key])).slice(0,ROUND_SIZE-pick.length));
  if(pick.length<ROUND_SIZE){ const rest=avail.filter(s=>!pick.includes(s)).sort((a,b)=>P.cards[a.key].d-P.cards[b.key].d); pick.push(...rest.slice(0,ROUND_SIZE-pick.length)); }
  return pick;
}
function grade(s,aOk,tOk){
  const t=today(), isNew=!P.cards[s.key], c=P.cards[s.key]||{b:0,d:t,n:0,ok:0};
  c.n++;
  if(aOk&&tOk){ c.ok++; c.b = isNew ? 3 : Math.min(c.b+1,INTERVALS.length-1); c.d=t+INTERVALS[c.b]; }
  else if(aOk||tOk){ c.b=Math.max(0,c.b-1); c.d=t+1; }
  else { c.b=0; c.d=t+1; }
  P.cards[s.key]=c; saveProg();
}
function stats(){
  const t=today(); let fresh=0,learning=0,known=0,due=0;
  for(const s of SONGS){
    if(P.skip[s.key]) continue;
    const c=P.cards[s.key]; if(!c){ fresh++; continue; }
    if(c.b>=KNOWN_LEVEL) known++; else learning++;
    if(c.d<=t) due++;
  }
  return {fresh,learning,known,due,total:fresh+learning+known};
}

/* ---------- Vyer ---------- */
function show(id){ ["home","play","summary"].forEach(v=>$(v).classList.toggle("hidden",v!==id)); window.scrollTo(0,0); }
function renderHome(){
  const st=stats();
  $("heroText").textContent = st.due>0 ? `${st.due} ${st.due===1?"låt":"låtar"} att repetera idag` : st.fresh>0 ? "Dags för nya låtar" : "Allt repeterat för idag";
  $("ledeText").textContent = st.due>0 ? "Rundan börjar med dem, sedan fylls den på med nya låtar." :
    st.fresh>0 ? `${st.fresh} låtar kvar som du inte har övat på än.` : "Du kan ändå köra en extra runda med de låtar som står näst på tur.";
  const parts=[["Kan",st.known,"var(--ok)"],["Lär mig",st.learning,"var(--amber)"],["Nya",st.fresh,"var(--surf2)"]];
  const m=$("meter"); m.textContent="";
  parts.forEach(([,n,c])=>{ if(!n) return; const s=document.createElement("span"); s.style.width=(n/Math.max(1,st.total)*100)+"%"; s.style.background=c; m.append(s); });
  const lg=$("legend"); lg.textContent="";
  parts.forEach(([label,n,c])=>{ const d=document.createElement("div"),b=document.createElement("b"),i=document.createElement("i"); b.textContent=n; i.style.background=c; d.append(b,i,label); lg.append(d); });
  $("startBtn").disabled = st.total===0;
  $("demoNote").classList.toggle("hidden",!usingDemo);
}

let round=null, current=null, answered=false, acA, acT;
async function startRound(){
  let songs=buildRound();
  if(!songs.length){ toast("Det finns inga låtar med ljud att öva på."); return; }
  const btn=$("startBtn"), again=$("againBtn");
  btn.disabled=again.disabled=true; btn.textContent=again.textContent="Hämtar ljud…";
  try{ await resolveSongs(songs); if(apiDown) songs=buildRound(); }
  finally{ btn.disabled=again.disabled=false; btn.textContent="Starta runda"; again.textContent="Ny runda"; }
  const playable=songs.filter(hasAudio);
  if(!playable.length){ toast("Inga av låtarna har ljudlänkar än. Skapa en ny songs.txt på datorn."); return; }
  round={queue:playable.map(s=>({s,retry:false})), i:0, firstCount:playable.length, results:[]};
  show("play"); nextCard(true);
}
function renderPips(){
  const p=$("pips"); p.textContent="";
  round.queue.forEach((_,i)=>{ const s=document.createElement("span"); if(i<round.i) s.className="done"; else if(i===round.i) s.className="cur"; p.append(s); });
  $("roundCount").textContent = round.queue[round.i].retry ? "Repris" : `Låt ${round.i+1} av ${round.firstCount}`;
}
function nextCard(first){
  if(!first) round.i++;
  if(round.i>=round.queue.length){ audio.pause(); finishRound(); return; }
  current=round.queue[round.i]; answered=false;
  renderPips();
  $("stage").classList.remove("revealed"); $("cover").removeAttribute("src");
  $("errBox").classList.add("hidden");
  $("artistIn").value=""; $("titleIn").value="";
  $("answerForm").classList.remove("hidden"); $("resultBox").classList.add("hidden");
  $("altList").classList.add("hidden"); $("altBtn").classList.toggle("hidden",apiDown);
  loadAudio(R[current.s.key].url); audio.play().catch(()=>{});
}
function revealCover(){
  const r=R[current.s.key], art=(r&&r.art)||current.s.art;
  if(!art) return;
  const img=$("cover");
  img.onload=()=>$("stage").classList.add("revealed");
  img.src=art;
}
function submit(dunno){
  if(answered || Date.now()<submitLockedUntil) return; answered=true; acA.hide(); acT.hide();
  const s=current.s, aIn=dunno?"":$("artistIn").value.trim(), tIn=dunno?"":$("titleIn").value.trim();
  const aOk=artistMatch(aIn,s.artist), tOk=isMatch(tIn,s.title);
  if(!current.retry){ grade(s,aOk,tOk); round.results.push({s,aOk,tOk}); if(!(aOk&&tOk)) round.queue.push({s,retry:true}); }
  fillRes("a",aOk,s.artist,aIn); fillRes("t",tOk,s.title,tIn);
  const c=P.cards[s.key];
  $("verdict").textContent = current.retry ? (aOk&&tOk?"Bra, nu satt den.":"Den kommer tillbaka i morgon.") :
    aOk&&tOk ? `Rätt! Nästa gång om ${INTERVALS[c.b]} ${INTERVALS[c.b]===1?"dag":"dagar"}.` : "Du får den igen i slutet av rundan och i morgon.";
  $("answerForm").classList.add("hidden"); $("resultBox").classList.remove("hidden");
  revealCover(); renderPips();
}
function fillRes(p,ok,right,you){
  const mk=$(p+"Mark"); mk.textContent=ok?"✓":"✕"; mk.className="mark "+(ok?"y":"n");
  $(p+"Right").textContent=right;
  const y=$(p+"You"); y.textContent="";
  if(!ok){ if(you){ y.append("Du skrev: "); const s=document.createElement("s"); s.textContent=you; y.append(s); } else y.textContent="Inget svar"; }
  else if(norm(you)!==norm(right) && normKeep(you)!==normKeep(right)) y.textContent=`Du skrev: ${you} (räknas som rätt)`;
}
async function showAlternatives(){
  const ul=$("altList"); ul.textContent=""; ul.classList.remove("hidden"); $("altBtn").classList.add("hidden");
  const note=t=>{ const li=document.createElement("li"); li.textContent=t; li.style.color="var(--muted)"; ul.append(li); };
  note("Söker…");
  let hits=[]; try{ hits=await searchHits(current.s,8); }catch(e){}
  ul.textContent="";
  if(!hits.length){ note(lastNetErr ? "Det går inte att söka hos Apple på den här enheten. Byt version på datorn i stället." : "Hittade inga andra versioner."); return; }
  const s=current.s;
  hits.forEach(h=>{
    const li=document.createElement("li"), b=document.createElement("button");
    b.textContent=`${h.trackName} – ${h.artistName}`;
    const sm=document.createElement("small"); sm.textContent=h.collectionName||""; b.append(sm);
    if(R[s.key]&&R[s.key].tid===h.trackId) b.classList.add("cur");
    b.onclick=()=>{ R[s.key]=hitToRes(h,true); saveRes(); [...ul.querySelectorAll("button")].forEach(x=>x.classList.remove("cur")); b.classList.add("cur");
      loadAudio(h.previewUrl); audio.play().catch(()=>{}); revealCover(); toast("Versionen är sparad. Skapa en ny songs.txt så följer den med till mobilen."); };
    li.append(b); ul.append(li);
  });
}
function skipSong(){
  P.skip[current.s.key]=true; saveProg();
  round.queue=round.queue.filter((q,i)=>i<round.i || q.s!==current.s);
  round.results=round.results.filter(r=>r.s!==current.s);
  round.firstCount=round.queue.filter(q=>!q.retry).length;
  toast("Låten är överhoppad."); round.i--; nextCard(false);
}
function finishRound(){
  const r=round.results, both=r.filter(x=>x.aOk&&x.tOk).length, st=stats();
  $("sumHero").textContent = r.length ? `${both} av ${r.length} helt rätt` : "Rundan är klar";
  $("sumLede").textContent = `Du kan nu ${st.known} av ${st.total} låtar.` + (st.due?` ${st.due} kvar att repetera idag.`:"");
  const ul=$("sumList"); ul.textContent="";
  r.forEach(({s,aOk,tOk})=>{
    const li=document.createElement("li"), t=document.createElement("div"), b=document.createElement("b"), sp=document.createElement("span"), d=document.createElement("div");
    const art=(R[s.key]&&R[s.key].art)||s.art;
    if(art){ const img=document.createElement("img"); img.src=art; img.alt=""; li.append(img); }
    t.className="t"; b.textContent=s.title; sp.textContent=s.artist; t.append(b,sp);
    d.className="dots"; d.title="Artist, titel";
    [aOk,tOk].forEach(ok=>{ const i=document.createElement("i"); if(ok) i.className="y"; d.append(i); });
    li.append(t,d); ul.append(li);
  });
  show("summary");
}

/* ---------- songs.txt ---------- */
let remoteBusy=false;
async function loadRemote(){
  if(remoteBusy || !location.protocol.startsWith("http")) return;
  remoteBusy=true;
  try{
    const r=await fetch("songs.txt",{cache:"no-store"});
    if(!r.ok) return;
    const parsed=parseSongInput(await r.text());
    if(!Array.isArray(parsed)) return;
    const before=usingDemo?0:SONGS.length, wasDemo=usingDemo;
    REMOTE_RAW=parsed; save(K_REMOTE,REMOTE_RAW); combineSongs(); saveRes();
    if(!$("home").classList.contains("hidden")) renderHome();
    const diff=SONGS.length-before;
    if(diff>0 && !wasDemo) toast(`${diff} nya låtar från songs.txt.`);
  }catch(e){} finally{ remoteBusy=false; }
}

/* ---------- Koppla ihop ---------- */
combineSongs();
acA=setupAC($("artistIn"),$("artistAc"),()=>artistOptions);
acT=setupAC($("titleIn"),$("titleAc"),()=>titleOptions);
$("startBtn").onclick=startRound;
$("againBtn").onclick=startRound;
$("homeBtn").onclick=()=>{ renderHome(); show("home"); };
$("quitBtn").onclick=()=>{ audio.pause(); if(round.results.length) finishRound(); else { renderHome(); show("home"); } };
$("stage").onclick=togglePlay;
$("playBtn").onclick=togglePlay;
$("restartBtn").onclick=restart;
$("submitBtn").onclick=()=>submit(false);
$("dunnoBtn").onclick=()=>submit(true);
$("nextBtn").onclick=()=>nextCard(false);
$("skipBtn").onclick=skipSong;
$("altBtn").onclick=showAlternatives;
document.addEventListener("keydown",e=>{
  if(e.key===" " && !$("play").classList.contains("hidden") && !["INPUT","TEXTAREA","BUTTON"].includes(document.activeElement.tagName)){ e.preventDefault(); togglePlay(); }
});
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") loadRemote(); });
renderHome();
loadRemote();
</script>
